<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M2 Viererkette – Gaming-Special</title><style>:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#182333;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:18px}main{max-width:720px;margin:0 auto}h1{text-align:center;margin:12px 0 4px;font-size:clamp(1.6rem,5vw,2.4rem)}.sub{text-align:center;color:#536172;margin:0 0 22px}.panel{background:white;border-radius:20px;padding:clamp(12px,3vw,26px);box-shadow:0 5px 25px #1b31511c}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.tile{min-height:75px;border:2px solid #e0e6ed;border-radius:12px;background:#eef1f6;font-weight:750;font-size:clamp(.77rem,2.8vw,1.1rem);overflow-wrap:anywhere;padding:5px;cursor:pointer;color:#1b293b}.tile:focus-visible,button:focus-visible{outline:3px solid #2878dc;outline-offset:2px}.tile.sel{background:#a9c9f9;border-color:#2463bc}.tile:disabled{cursor:default}.solved{padding:14px 6px;border-radius:12px;text-align:center;margin-bottom:9px}.solved strong{display:block;margin-bottom:4px}.solved span{font-size:.93rem}.s0{background:#c9ead0}.s1{background:#f5e4a6}.s2{background:#c4dff5}.s3{background:#e3cbf4}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:17px}button.action{border:0;border-radius:99px;padding:12px 18px;font-size:1rem;font-weight:650;cursor:pointer;background:#e9eef5;color:#17263c}button.primary{background:#183d75;color:white}button:disabled{opacity:.45;cursor:not-allowed}.status{text-align:center;min-height:28px;margin:15px 0 0;font-weight:650}.meta{display:flex;justify-content:space-between;gap:8px;margin:10px 0;color:#586575;font-size:.88rem}.footer{text-align:center;color:#586575;font-size:.85rem;margin-top:17px}#done{text-align:center;font-size:1.15rem;font-weight:700;margin-top:12px}@media(max-width:420px){body{padding:9px}.grid{gap:5px}.tile{min-height:68px}.panel{padding:12px}button.action{padding:11px 13px}}</style></head><body><main><h1>🎮 M2-Viererkette</h1><p class="sub">Gaming-Special · Finde vier Gruppen mit je vier Wörtern!</p><section class="panel"><div id="solved" aria-live="polite"></div><div class="grid" id="grid" aria-label="Wortfelder"></div><div class="meta"><span id="counter">0 von 4 ausgewählt</span><span id="mistakes">Fehlversuche: 0</span></div><div id="status" class="status" role="status" aria-live="polite"></div><div id="done" aria-live="polite"></div><div class="controls"><button class="action" id="clear">Auswahl löschen</button><button class="action primary" id="check">Prüfen</button><button class="action" id="shuffle">Mischen</button><button class="action" id="restart">Neu starten</button></div></section><p class="footer">Tipp: Ein Wort kann scheinbar zu mehreren Gruppen passen. Überlege genau!</p></main><script>
const groups=[{title:'Videospiele',words:['GTA','Fortnite','Minecraft','Roblox']},{title:'Tiere',words:['Hunde','Mäuse','Katzen','Pferde']},{title:'Essen',words:['Pizza','Döner','Burger','Pommes']},{title:'Unsere M2-Insider',words:['Six Seven','Timgio','MEOWL','Gänse']}];
const all=groups.flatMap(g=>g.words);let order=[],selected=[],found=[],errors=0;
const $=id=>document.getElementById(id);function shuffleArray(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function render(){const remaining=order.filter(w=>!found.some(i=>groups[i].words.includes(w)));$('solved').innerHTML='';found.forEach((i,n)=>{let el=document.createElement('div');el.className='solved s'+n;let heading=document.createElement('strong');heading.textContent=groups[i].title;let words=document.createElement('span');words.textContent=groups[i].words.join(' · ');el.append(heading,words);$('solved').append(el)});$('grid').innerHTML='';remaining.forEach(w=>{const b=document.createElement('button');b.className='tile'+(selected.includes(w)?' sel':'');b.textContent=w;b.setAttribute('aria-pressed',selected.includes(w));b.onclick=()=>{if(selected.includes(w))selected=selected.filter(x=>x!==w);else if(selected.length<4)selected.push(w);$('status').textContent='';render()};$('grid').append(b)});$('counter').textContent=selected.length+' von 4 ausgewählt';$('mistakes').textContent='Fehlversuche: '+errors;$('check').disabled=selected.length!==4;$('shuffle').disabled=remaining.length===0;$('done').textContent=found.length===4?'🏆 Geschafft! Alle vier Gruppen gefunden!':''}
$('check').onclick=()=>{let idx=groups.findIndex((g,i)=>!found.includes(i)&&g.words.every(w=>selected.includes(w)));if(idx>=0){found.push(idx);selected=[];$('status').textContent='Richtig! 🎉'}else{errors++;let best=Math.max(...groups.filter((g,i)=>!found.includes(i)).map(g=>g.words.filter(w=>selected.includes(w)).length));$('status').textContent=best===3?'Knapp daneben! Drei Wörter passen zusammen.':'Noch nicht richtig – versuch es erneut!'}render()};$('clear').onclick=()=>{selected=[];$('status').textContent='';render()};$('shuffle').onclick=()=>{const positions=order.map((w,i)=>found.some(g=>groups[g].words.includes(w))?-1:i).filter(i=>i>=0);const vals=shuffleArray(positions.map(i=>order[i]));positions.forEach((p,i)=>order[p]=vals[i]);selected=[];$('status').textContent='';render()};$('restart').onclick=reset;function reset(){order=shuffleArray([...all]);selected=[];found=[];errors=0;$('status').textContent='';render()}reset();
</script></body></html>
