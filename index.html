<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M2 Rätselwerkstatt</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#19253b;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:20px 14px 50px}header{background:#243e74;color:white;padding:22px;border-radius:18px;margin-bottom:18px}h1{margin:0;font-size:clamp(24px,5vw,36px)}h2{margin:8px 0 16px}p{line-height:1.5}button{font:inherit;cursor:pointer;border:0;border-radius:11px;padding:12px 14px;font-weight:650}button:focus-visible{outline:3px solid #3186e8;outline-offset:2px}.btn{background:#284b90;color:white}.secondary{background:#e6ebf5;color:#1a3157}.light{background:white;color:#234175}.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.gamecard{background:white;border:1px solid #dce3ee;text-align:left;padding:18px;box-shadow:0 2px 6px #15284a0b}.gamecard strong{display:block;font-size:18px;margin:8px 0}.gamecard small{color:#53647b}.panel{background:white;border-radius:16px;padding:18px;border:1px solid #dce3ee}.topbar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:16px 0}.tile{min-height:78px;background:#e9edf5;color:#15243c;overflow-wrap:anywhere;padding:8px 3px;font-size:clamp(12px,2.5vw,17px)}.tile.sel{background:#8bb7fa;color:#112647;outline:2px solid #265cae}.solved{border-radius:12px;padding:14px;text-align:center;margin:8px 0}.solved b{display:block}.solved span{display:block;font-size:14px;margin-top:4px}.actions{display:flex;flex-wrap:wrap;gap:8px}.status{min-height:26px;font-weight:650}.muted{color:#53647b;font-size:14px}.footer{margin-top:16px}.hidden{display:none}.hint{background:#fdf3d9;border-radius:10px;padding:12px;margin-top:10px}.success{color:#216b46}@media(max-width:420px){.tile{min-height:66px}.panel{padding:12px}.actions button{flex:1}}
</style></head><body><main><header><h1>🧩 M2-Rätselwerkstatt</h1><p>Vier Wörter gehören zusammen. Finde alle vier Gruppen!</p></header><section id="home"><h2>Wähle ein Rätsel</h2><div class="menu" id="menu"></div><p class="muted">Keine Anmeldung nötig. Du kannst jedes Rätsel beliebig oft spielen.</p></section><section id="play" class="hidden"><div class="topbar"><button class="secondary" id="back">← Alle Rätsel</button><span class="muted" id="level"></span></div><h2 id="gametitle"></h2><div class="panel"><p id="intro" class="muted"></p><div id="solved"></div><div class="grid" id="grid"></div><p id="status" class="status" role="status" aria-live="polite"></p><p class="muted" id="count"></p><div class="actions"><button class="btn" id="check">Prüfen</button><button class="secondary" id="clear">Auswahl löschen</button><button class="secondary" id="hint">Tipp</button><button class="secondary" id="restart">Neustart</button></div><div id="hintbox" class="hint hidden"></div></div><div class="footer"><button class="secondary" id="next">Nächstes Rätsel →</button></div></section></main><script>
const puzzles=[
{title:'Gaming-Special & M2-Insider',level:'★ Leicht',groups:[['Videospiele','GTA','Fortnite','Minecraft','Roblox'],['Tiere','Hunde','Mäuse','Katzen','Pferde'],['Essen','Pizza','Döner','Burger','Pommes'],['Unsere M2-Insider','Six Seven','Timgio','MEOWL','Gänse']]},
{title:'Schule & Freizeit',level:'★ Leicht',groups:[['Schulsachen','Heft','Lineal','Radiergummi','Füller'],['Sportarten','Tennis','Fußball','Basketball','Schwimmen'],['Obst','Apfel','Banane','Birne','Kiwi'],['Verkehrsmittel','Bus','Zug','Fahrrad','Straßenbahn']]},
{title:'Jugendsprache & Gaming',level:'★★ Mittel',groups:[['Jugendsprache','Digga','Wallah','Cringe','Schere'],['Werkzeuge','Hammer','Zange','Säge','Bohrer'],['Gaming-Begriffe','Level','Quest','Loot','Respawn'],['Wörter mit -ball','Fuß','Hand','Basket','Volley']]},
{title:'Gefühle, Körper & Sinne',level:'★★ Mittel',groups:[['Gefühle','Freude','Angst','Wut','Trauer'],['Sinnesorgane','Augen','Ohren','Nase','Zunge'],['Körperteile mit Gelenken','Knie','Ellbogen','Finger','Schulter'],['Wörter mit Herz-','Schlag','Klopfen','Frequenz','Rhythmus']]},
{title:'Doppelte Bedeutungen',level:'★★★ Knifflig',groups:[['Kann man aufschließen','Tür','Schrank','Auto','Tresor'],['Hat eine Krone','König','Baum','Zahn','Prinzessin'],['Hat einen Flügel','Vogel','Flugzeug','Klavier','Engel'],['Kann man schlagen','Ball','Trommel','Rekord','Purzelbaum']]},
{title:'Wortverbindungen',level:'★★★ Anspruchsvoll',groups:[['Vor „Schuh“','Haus','Turn','Wander','Fußball'],['Vor „Ball“','Fuß','Hand','Basket','Volley'],['Nach „Sonnen“','Brille','Blume','Schirm','Brand'],['Nach „Wasser“','Fall','Flasche','Hahn','Melone']]}
];
// Avoid repeated exact words across groups in a puzzle; category names are revealed after solving.
const $=id=>document.getElementById(id);let active=0,selected=[],found=[],errors=0,order=[];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function openGame(i){active=i;selected=[];found=[];errors=0;order=shuffle(puzzles[i].groups.flatMap(g=>g.slice(1)));$('home').classList.add('hidden');$('play').classList.remove('hidden');$('gametitle').textContent=puzzles[i].title;$('level').textContent=puzzles[i].level;$('intro').textContent='Tippe vier passende Wörter an und drücke auf „Prüfen“. Manche Wörter können dich auf eine falsche Fährte locken.';$('hintbox').classList.add('hidden');render();window.scrollTo(0,0)}
function render(){const p=puzzles[active];$('solved').replaceChildren();found.forEach((i,n)=>{const g=p.groups[i],el=document.createElement('div');el.className='solved';el.style.background=['#d6efdc','#fff0b9','#dce8ff','#edddf5'][n];const b=document.createElement('b');b.textContent=g[0];const s=document.createElement('span');s.textContent=g.slice(1).join(' · ');el.append(b,s);$('solved').append(el)});$('grid').replaceChildren();order.filter(w=>!found.some(i=>p.groups[i].slice(1).includes(w))).forEach(w=>{let b=document.createElement('button');b.className='tile'+(selected.includes(w)?' sel':'');b.textContent=w;b.setAttribute('aria-pressed',selected.includes(w));b.onclick=()=>{selected=selected.includes(w)?selected.filter(x=>x!==w):selected.length<4?[...selected,w]:selected;$('status').textContent='';render()};$('grid').append(b)});$('count').textContent=`${found.length} von 4 Gruppen gefunden · ${errors} Fehlversuche · ${selected.length} von 4 Wörtern ausgewählt`;$('check').disabled=selected.length!==4;$('next').style.display=found.length===4?'inline-block':'none';if(found.length===4){$('status').textContent='🎉 Geschafft! Alle vier Gruppen gefunden.';$('status').className='status success'}}
$('check').onclick=()=>{if(selected.length!==4)return;const p=puzzles[active];const i=p.groups.findIndex((g,i)=>!found.includes(i)&&g.slice(1).every(w=>selected.includes(w)));if(i>=0){found.push(i);selected=[];$('status').textContent='Richtig!';$('hintbox').classList.add('hidden');render()}else{errors++;let max=Math.max(...p.groups.map((g,i)=>found.includes(i)?0:g.slice(1).filter(w=>selected.includes(w)).length));$('status').textContent=max===3?'Knapp daneben! Drei Wörter gehören zusammen.':'Noch nicht richtig. Versuch es erneut!';$('count').textContent=`${found.length} von 4 Gruppen gefunden · ${errors} Fehlversuche · 4 von 4 Wörtern ausgewählt`}};
$('clear').onclick=()=>{selected=[];$('status').textContent='';render()};$('restart').onclick=()=>openGame(active);$('hint').onclick=()=>{const g=puzzles[active].groups.find((g,i)=>!found.includes(i));$('hintbox').textContent='Eine gesuchte Kategorie lautet: '+g[0]+'.';$('hintbox').classList.remove('hidden')};$('back').onclick=()=>{$('play').classList.add('hidden');$('home').classList.remove('hidden');window.scrollTo(0,0)};$('next').onclick=()=>openGame((active+1)%puzzles.length);
puzzles.forEach((p,i)=>{let b=document.createElement('button');b.className='gamecard';b.innerHTML='<small>Rätsel '+(i+1)+' · '+p.level+'</small><strong></strong><small>16 Wörter · 4 Gruppen</small>';b.querySelector('strong').textContent=p.title;b.onclick=()=>openGame(i);$('menu').append(b)});
</script></body></html>
